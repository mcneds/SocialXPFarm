name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: socialxpfarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install companion dependencies
        run: python -m pip install -r remote-login/requirements.lock
      - name: Test companion and developer scenarios
        env:
          PYTHONPATH: remote-login
        run: |
          python -m unittest discover -s remote-login/tests -v
          python remote-login/dev_scenarios.py

  build:
    needs: companion-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle --no-daemon clean build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: socialxpfarm
          path: build/libs/socialxpfarm-*.jar
          if-no-files-found: error

      - name: Package remote login companion
        run: |
          python3 remote-login/package_release.py build/SocialXPFarm-remote-login.zip

      - name: Upload companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: socialxpfarm-remote-login
          path: build/SocialXPFarm-remote-login.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jar="$(find build/libs -maxdepth 1 -type f -name 'socialxpfarm-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$jar"
          cp "$jar" build/libs/SocialXPFarm-latest.jar
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build \
            build/libs/SocialXPFarm-latest.jar \
            build/SocialXPFarm-remote-login.zip \
            --target "$GITHUB_SHA" \
            --title "Latest Build" \
            --notes "Minecraft 26.2 / Fabric"
